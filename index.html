<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천기</title>
  <style>
    :root {
      --bg1: #4f46e5;
      --bg2: #9333ea;
      --card: rgba(255, 255, 255, 0.96);
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.15), transparent 25%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 860px;
      background: var(--card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 28px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .title-wrap {
      text-align: left;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      color: #4338ca;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .primary-btn {
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      box-shadow: 0 10px 24px rgba(79, 70, 229, 0.35);
    }

    .secondary-btn {
      color: #374151;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
    }

    .secondary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      margin-bottom: 18px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: #4b5563;
      font-size: 0.94rem;
    }

    .meta strong {
      color: #111827;
    }

    .sets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .set-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 6px 18px rgba(17, 24, 39, 0.04);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .set-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.08);
    }

    .set-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .set-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: #374151;
    }

    .set-text {
      font-size: 0.86rem;
      color: #6b7280;
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ball {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.14);
      user-select: none;
    }

    .range-1 { background: #f59e0b; }
    .range-2 { background: #3b82f6; }
    .range-3 { background: #ef4444; }
    .range-4 { background: #6b7280; }
    .range-5 { background: #22c55e; }

    .empty {
      border: 2px dashed #d1d5db;
      border-radius: var(--radius-lg);
      padding: 30px 20px;
      text-align: center;
      color: #6b7280;
      background: rgba(249, 250, 251, 0.7);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(17, 24, 39, 0.94);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .app {
        padding: 20px;
      }

      .header {
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .ball {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="page-title">
    <section class="header">
      <div class="title-wrap">
        <h1 id="page-title">🎯 로또 번호 추천기</h1>
        <p class="subtitle">
          실험용.
        </p>
      </div>

      <div class="actions">
        <button id="generateBtn" class="primary-btn" type="button">번호 5세트 생성</button>
        <button id="copyBtn" class="secondary-btn" type="button" disabled>결과 복사</button>
      </div>
    </section>

    <section class="toolbar" aria-label="생성 정보">
      <div class="meta">
        <span><strong>세트 수:</strong> 5세트</span>
        <span><strong>번호 범위:</strong> 1~45</span>
        <span><strong>상태:</strong> <span id="statusText">대기 중</span></span>
      </div>
      <div class="meta">
        <span><strong>생성 시각:</strong> <span id="generatedAt">-</span></span>
      </div>
    </section>

    <section id="resultArea" aria-live="polite" aria-atomic="true">
      <div class="empty">
        아직 생성된 번호가 없습니다.<br />
        <strong>“번호 5세트 생성”</strong> 버튼을 눌러 시작하세요.
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const CONFIG = {
        setsPerDraw: 5,
        numbersPerSet: 6,
        maxNumber: 45
      };

      const generateBtn = document.getElementById('generateBtn');
      const copyBtn = document.getElementById('copyBtn');
      const resultArea = document.getElementById('resultArea');
      const generatedAt = document.getElementById('generatedAt');
      const statusText = document.getElementById('statusText');
      const toast = document.getElementById('toast');

      let latestSets = [];

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => {
          toast.classList.remove('show');
        }, 1800);
      }

      function getBallClass(number) {
        if (number <= 10) return 'range-1';
        if (number <= 20) return 'range-2';
        if (number <= 30) return 'range-3';
        if (number <= 40) return 'range-4';
        return 'range-5';
      }

      function formatTime(date) {
        return new Intl.DateTimeFormat('ko-KR', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).format(date);
      }

      function generateOneSet() {
        const picked = new Set();

        while (picked.size < CONFIG.numbersPerSet) {
          const value = Math.floor(Math.random() * CONFIG.maxNumber) + 1;
          picked.add(value);
        }

        return [...picked].sort((a, b) => a - b);
      }

      function generateAllSets() {
        return Array.from(
          { length: CONFIG.setsPerDraw },
          () => generateOneSet()
        );
      }

      function createBall(number) {
        const ball = document.createElement('span');
        ball.className = `ball ${getBallClass(number)}`;
        ball.textContent = number;
        ball.setAttribute('aria-label', `번호 ${number}`);
        return ball;
      }

      function renderSets(sets) {
        const wrapper = document.createElement('div');
        wrapper.className = 'sets';

        sets.forEach((numbers, index) => {
          const card = document.createElement('article');
          card.className = 'set-card';

          const header = document.createElement('div');
          header.className = 'set-header';

          const title = document.createElement('div');
          title.className = 'set-title';
          title.textContent = `세트 ${index + 1}`;

          const text = document.createElement('div');
          text.className = 'set-text';
          text.textContent = numbers.join(' · ');

          const numbersWrap = document.createElement('div');
          numbersWrap.className = 'numbers';
          numbersWrap.setAttribute('role', 'list') ;
          numbersWrap.setAttribute('aria-label', `로또 번호 세트 ${index + 1}`);

          numbers.forEach(number => {
            const item = document.createElement('div');
            item.setAttribute('role', 'listitem');
            item.appendChild(createBall(number));
            numbersWrap.appendChild(item);
          });

          header.appendChild(title);
          header.appendChild(text);
          card.appendChild(header);
          card.appendChild(numbersWrap);
          wrapper.appendChild(card);
        });

        resultArea.innerHTML = '';
        resultArea.appendChild(wrapper);
      }

      function handleGenerate() {
        latestSets = generateAllSets();
        renderSets(latestSets);

        const now = new Date();
        generatedAt.textContent = formatTime(now);
        statusText.textContent = '생성 완료';
        copyBtn.disabled = false;
      }

      async function handleCopy() {
        if (!latestSets.length) return;

        const text = latestSets
          .map((set, index) => `세트 ${index + 1}: ${set.join(', ')}`)
          .join('\n');

        try {
          await navigator.clipboard.writeText(text);
          showToast('결과를 복사했습니다.');
        } catch (error) {
          showToast('복사에 실패했습니다.');
          console.error(error);
        }
      }

      generateBtn.addEventListener('click', handleGenerate);
      copyBtn.addEventListener('click', handleCopy);
    })();
  </script>
</body>
</html>
