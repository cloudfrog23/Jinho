<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 & 동물상 테스트</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    :root {
      --bg1: #4f46e5;
      --bg2: #9333ea;
      --card: rgba(255, 255, 255, 0.96);
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --card-bg: #ffffff;
      --toolbar-bg: #f9fafb;
      --btn-secondary-bg: #f3f4f6;
      --btn-secondary-text: #374151;
      --set-card-bg: #ffffff;
      --set-title: #374151;
      --empty-bg: rgba(249, 250, 251, 0.7);
      --empty-border: #d1d5db;
      --toast-bg: rgba(17, 24, 39, 0.94);
      --toast-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg1: #1e1b4b;
      --bg2: #312e81;
      --card: rgba(31, 41, 55, 0.96);
      --text: #f9fafb;
      --muted: #9ca3af;
      --line: #374151;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      --card-bg: #1f2937;
      --toolbar-bg: #111827;
      --btn-secondary-bg: #4b5563;
      --btn-secondary-text: #f9fafb;
      --set-card-bg: #374151;
      --set-title: #f3f4f6;
      --empty-bg: rgba(17, 24, 39, 0.7);
      --empty-border: #4b5563;
      --toast-bg: rgba(249, 250, 251, 0.94);
      --toast-text: #111827;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.1), transparent 25%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 860px;
      background: var(--card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 28px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .title-wrap {
      text-align: left;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      color: #4f46e5;
    }

    [data-theme="dark"] h1 {
      color: #818cf8;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease, background-color 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .primary-btn {
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      box-shadow: 0 10px 24px rgba(79, 70, 229, 0.35);
    }

    .secondary-btn {
      color: var(--btn-secondary-text);
      background: var(--btn-secondary-bg);
      border: 1px solid var(--line);
    }

    .secondary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .theme-toggle {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      padding: 0;
      font-size: 1.2rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--toolbar-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      margin-bottom: 18px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .meta strong {
      color: var(--text);
    }

    .sets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .set-card {
      background: var(--set-card-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .set-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    .set-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .set-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--set-title);
    }

    .set-text {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ball {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.14);
      user-select: none;
      transition: none;
    }

    .range-1 { background: #f59e0b; }
    .range-2 { background: #3b82f6; }
    .range-3 { background: #ef4444; }
    .range-4 { background: #6b7280; }
    .range-5 { background: #22c55e; }

    .empty {
      border: 2px dashed var(--empty-border);
      border-radius: var(--radius-lg);
      padding: 30px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--empty-bg);
    }

    /* 동물상 테스트 스타일 */
    .animal-section {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 2px solid var(--line);
    }

    .webcam-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    #webcam-container {
      width: 200px;
      height: 200px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow);
    }

    #label-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .progress-bar {
      flex: 1;
      height: 12px;
      background: var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5, #9333ea);
      width: 0%;
      transition: width 0.2s ease;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--toast-bg);
      color: var(--toast-text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .app {
        padding: 20px;
      }

      .header {
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .actions button:not(.theme-toggle) {
        flex: 1;
      }

      .ball {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="page-title">
    <section class="header">
      <div class="title-wrap">
        <h1 id="page-title">🎯 로또 번호 추천기</h1>
        <p class="subtitle">
          버튼을 누르면 로또 번호 5세트를 한 번에 추천합니다.
        </p>
      </div>

      <div class="actions">
        <button id="themeToggle" class="theme-toggle" type="button" title="테마 변경" aria-label="테마 변경">🌓</button>
        <button id="generateBtn" class="primary-btn" type="button">번호 5세트 생성</button>
        <button id="copyBtn" class="secondary-btn" type="button" disabled>결과 복사</button>
      </div>
    </section>

    <section class="toolbar" aria-label="생성 정보">
      <div class="meta">
        <span><strong>세트 수:</strong> 5세트</span>
        <span><strong>번호 범위:</strong> 1~45</span>
        <span><strong>상태:</strong> <span id="statusText">대기 중</span></span>
      </div>
      <div class="meta">
        <span><strong>생성 시각:</strong> <span id="generatedAt">-</span></span>
      </div>
    </section>

    <section id="resultArea" aria-live="polite" aria-atomic="true">
      <div class="empty">
        아직 생성된 번호가 없습니다.<br />
        <strong>“번호 5세트 생성”</strong> 버튼을 눌러 시작하세요.
      </div>
    </section>

    <!-- 동물상 테스트 섹션 -->
    <section class="animal-section" aria-labelledby="animal-title">
      <div class="header">
        <div class="title-wrap">
          <h1 id="animal-title">🐶🐱 동물상 테스트</h1>
          <p class="subtitle">사진을 업로드하여 강아지상인지 고양이상인지 확인해보세요!</p>
        </div>
        <div class="actions">
          <input type="file" id="imageUpload" accept="image/*" style="display: none;">
          <button id="uploadBtn" class="secondary-btn" type="button">이미지 선택</button>
          <button id="predictBtn" class="primary-btn" type="button" disabled>동물상 분석하기</button>
        </div>
      </div>

      <div class="webcam-wrapper">
        <div id="image-container">
          <img id="faceImage" src="#" alt="미리보기" style="display: none; width: 100%; height: 100%; object-fit: cover;">
          <div id="image-placeholder" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.9rem;">이미지를 선택해주세요</div>
        </div>
        <div id="label-container" aria-live="polite"></div>
      </div>
    </section>

    <!-- Disqus 댓글 섹션 추가 -->
    <section class="comments-section" style="margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px;">
      <div id="disqus_thread"></div>
      <script>
          /**
          *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
          *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
          /*
          var disqus_config = function () {
          this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
          this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
          };
          */
          (function() { // DON'T EDIT BELOW THIS LINE
          var d = document, s = d.createElement('script');
          s.src = 'https://productbulider.disqus.com/embed.js';
          s.setAttribute('data-timestamp', +new Date());
          (d.head || d.body).appendChild(s);
          })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const CONFIG = {
        setsPerDraw: 5,
        numbersPerSet: 6,
        maxNumber: 45
      };

      const themeToggle = document.getElementById('themeToggle');
      const generateBtn = document.getElementById('generateBtn');
      const copyBtn = document.getElementById('copyBtn');
      const resultArea = document.getElementById('resultArea');
      const generatedAt = document.getElementById('generatedAt');
      const statusText = document.getElementById('statusText');
      const toast = document.getElementById('toast');

      let latestSets = [];

      // Theme Management
      function initTheme() {
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
      }

      function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      }

      themeToggle.addEventListener('click', toggleTheme);
      initTheme();

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => {
          toast.classList.remove('show');
        }, 1800);
      }

      function getBallClass(number) {
        if (number <= 10) return 'range-1';
        if (number <= 20) return 'range-2';
        if (number <= 30) return 'range-3';
        if (number <= 40) return 'range-4';
        return 'range-5';
      }

      function formatTime(date) {
        return new Intl.DateTimeFormat('ko-KR', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).format(date);
      }

      function generateOneSet() {
        const picked = new Set();

        while (picked.size < CONFIG.numbersPerSet) {
          const value = Math.floor(Math.random() * CONFIG.maxNumber) + 1;
          picked.add(value);
        }

        return [...picked].sort((a, b) => a - b);
      }

      function generateAllSets() {
        return Array.from(
          { length: CONFIG.setsPerDraw },
          () => generateOneSet()
        );
      }

      function createBall(number) {
        const ball = document.createElement('span');
        ball.className = `ball ${getBallClass(number)}`;
        ball.textContent = number;
        ball.setAttribute('aria-label', `번호 ${number}`);
        return ball;
      }

      function renderSets(sets) {
        const wrapper = document.createElement('div');
        wrapper.className = 'sets';

        sets.forEach((numbers, index) => {
          const card = document.createElement('article');
          card.className = 'set-card';

          const header = document.createElement('div');
          header.className = 'set-header';

          const title = document.createElement('div');
          title.className = 'set-title';
          title.textContent = `세트 ${index + 1}`;

          const text = document.createElement('div');
          text.className = 'set-text';
          text.textContent = numbers.join(' · ');

          const numbersWrap = document.createElement('div');
          numbersWrap.className = 'numbers';
          numbersWrap.setAttribute('role', 'list');
          numbersWrap.setAttribute('aria-label', `로또 번호 세트 ${index + 1}`);

          numbers.forEach(number => {
            const item = document.createElement('div');
            item.setAttribute('role', 'listitem');
            item.appendChild(createBall(number));
            numbersWrap.appendChild(item);
          });

          header.appendChild(title);
          header.appendChild(text);
          card.appendChild(header);
          card.appendChild(numbersWrap);
          wrapper.appendChild(card);
        });

        resultArea.innerHTML = '';
        resultArea.appendChild(wrapper);
      }

      function handleGenerate() {
        latestSets = generateAllSets();
        renderSets(latestSets);

        const now = new Date();
        generatedAt.textContent = formatTime(now);
        statusText.textContent = '생성 완료';
        copyBtn.disabled = false;
      }

      async function handleCopy() {
        if (!latestSets.length) return;

        const text = latestSets
          .map((set, index) => `세트 ${index + 1}: ${set.join(', ')}`)
          .join('\n');

        try {
          await navigator.clipboard.writeText(text);
          showToast('결과를 복사했습니다.');
        } catch (error) {
          showToast('복사에 실패했습니다.');
          console.error(error);
        }
      }

      generateBtn.addEventListener('click', handleGenerate);
      copyBtn.addEventListener('click', handleCopy);

      // Animal Face Test Logic (Image Upload Version)
      const ANIMAL_URL = "https://teachablemachine.withgoogle.com/models/mkq1AWNx7/";
      let animalModel, labelContainer, maxPredictions;

      const imageUpload = document.getElementById('imageUpload');
      const uploadBtn = document.getElementById('uploadBtn');
      const predictBtn = document.getElementById('predictBtn');
      const faceImage = document.getElementById('faceImage');
      const imagePlaceholder = document.getElementById('imagePlaceholder');

      async function loadAnimalModel() {
        if (animalModel) return;
        
        predictBtn.disabled = true;
        predictBtn.textContent = '모델 로딩 중...';
        
        const modelURL = ANIMAL_URL + "model.json";
        const metadataURL = ANIMAL_URL + "metadata.json";
        
        try {
          animalModel = await tmImage.load(modelURL, metadataURL);
          maxPredictions = animalModel.getTotalClasses();
          
          labelContainer = document.getElementById("label-container");
          labelContainer.innerHTML = '';
          for (let i = 0; i < maxPredictions; i++) {
            const row = document.createElement("div");
            row.className = 'label-row';
            row.innerHTML = `
              <span class="label-name" style="width: 60px;"></span>
              <div class="progress-bar"><div class="progress-fill"></div></div>
              <span class="label-prob" style="width: 40px;"></span>
            `;
            labelContainer.appendChild(row);
          }
          predictBtn.textContent = '동물상 분석하기';
        } catch (error) {
          console.error(error);
          showToast('모델을 불러오지 못했습니다.');
        }
      }

      async function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        await loadAnimalModel();

        const reader = new FileReader();
        reader.onload = async (e) => {
          faceImage.src = e.target.result;
          faceImage.style.display = 'block';
          imagePlaceholder.style.display = 'none';
          predictBtn.disabled = false; // 이미지 로드 완료 시 분석 버튼 활성화
        };
        reader.readAsDataURL(file);
      }

      async function predictAnimal() {
        if (!animalModel || !faceImage.src || faceImage.src.includes('#')) {
          showToast('먼저 이미지를 선택해주세요.');
          return;
        }

        predictBtn.disabled = true;
        predictBtn.textContent = '분석 중...';

        try {
          const prediction = await animalModel.predict(faceImage);
          for (let i = 0; i < maxPredictions; i++) {
            const classPrediction = prediction[i].className;
            const probability = (prediction[i].probability * 100).toFixed(0);
            
            const row = labelContainer.childNodes[i];
            row.querySelector('.label-name').textContent = classPrediction;
            row.querySelector('.progress-fill').style.width = probability + '%';
            row.querySelector('.label-prob').textContent = probability + '%';
          }
          showToast('분석이 완료되었습니다!');
        } catch (error) {
          console.error(error);
          showToast('분석 중 오류가 발생했습니다.');
        } finally {
          predictBtn.disabled = false;
          predictBtn.textContent = '동물상 분석하기';
        }
      }

      uploadBtn.addEventListener('click', () => imageUpload.click());
      imageUpload.addEventListener('change', handleImageUpload);
      predictBtn.addEventListener('click', predictAnimal);
      
      // 페이지 로드 시 모델 미리 로드
      loadAnimalModel();
    })();
  </script>
</body>
</html>
